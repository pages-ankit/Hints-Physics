<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Exercise Hints</title>

  <!-- KaTeX for Physics LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body);"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 16px;
      max-width: 800px;
      margin: auto;
      background: #fafafa;
      color: #1a1a1a;
    }
    h1 { font-size: 1.3rem; margin-bottom: 12px; }

    /* Exercise Selection Tabs */
    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 6px;
    }
    .tab-btn {
      padding: 6px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
    }
    .tab-btn.active {
      background: #0066cc;
      color: #fff;
      border-color: #0055aa;
    }

    /* Question Number Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }
    .q-btn {
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #ddd;
      background: #f8f8f8;
      cursor: pointer;
      border-radius: 3px;
      text-align: center;
    }
    .q-btn:hover { background: #e8e8e8; }
    .q-btn.active { background: #222; color: #fff; border-color: #222; }

    /* Footer & Navigation Link */
    footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .prism-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #0066cc;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid #d0e2ff;
      background: #f0f6ff;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .prism-link:hover {
      background: #0066cc;
      color: #fff;
      border-color: #0066cc;
    }
    
    /* Hint Box Area */
    #hint-box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 16px;
      background: #fff;
      min-height: 180px;
    }
    .hint-header {
      font-size: 1.05rem;
      font-weight: bold;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .hint-section { margin-bottom: 12px; }
    .hint-section img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      margin-top: 6px;
      display: block;
    }
    audio { width: 100%; margin-top: 6px; }
    .empty-state { color: #777; font-style: italic; }
  </style>
</head>
<body>

  <h1>Hints: Capacitance Module</h1>

  <!-- Dynamic Section Tabs -->
  <div class="tabs-bar" id="tabs-container"></div>

  <!-- Dynamic Question Grid -->
  <div class="grid-container" id="index-grid"></div>

  <!-- Hint Viewer -->
  <div id="hint-box">
    <div class="empty-state">Select a question number to view hints.</div>
  </div>

  <!-- Load Data -->
  <script src="data.js"></script>

  <script>
    const tabsContainer = document.getElementById("tabs-container");
    const gridContainer = document.getElementById("index-grid");
    const hintBox = document.getElementById("hint-box");

    let currentExercise = Object.keys(exercisesData)[0];

    // 1. Render Tabs
    function renderTabs() {
      tabsContainer.innerHTML = "";
      Object.keys(exercisesData).forEach(exKey => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${exKey === currentExercise ? 'active' : ''}`;
        btn.textContent = exKey;
        btn.onclick = () => {
          currentExercise = exKey;
          renderTabs();
          renderQuestionGrid();
          resetHintBox();
        };
        tabsContainer.appendChild(btn);
      });
    }

    // 2. Render Questions for Selected Exercise
    function renderQuestionGrid() {
      gridContainer.innerHTML = "";
      const exConfig = exercisesData[currentExercise];
      if (!exConfig) return;

      for (let i = 1; i <= exConfig.totalQuestions; i++) {
        const btn = document.createElement("button");
        btn.className = "q-btn";
        btn.textContent = i;
        btn.onclick = () => loadHint(i, btn);
        gridContainer.appendChild(btn);
      }
    }

    // 3. Display Selected Hint
    function loadHint(qNum, btnElement) {
      document.querySelectorAll(".q-btn").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");

      const hints = exercisesData[currentExercise]?.hints || {};
      const data = hints[qNum];

      if (!data) {
        hintBox.innerHTML = `
          <div class="hint-header">${currentExercise} — Q${qNum}</div>
          <p class="empty-state">No hint uploaded for this question yet.</p>
        `;
        return;
      }

      let contentHTML = `<div class="hint-header">${currentExercise} — Question ${qNum}</div>`;

      if (data.text) {
        contentHTML += `<div class="hint-section"><p>${data.text}</p></div>`;
      }
      if (data.image) {
        contentHTML += `
          <div class="hint-section">
            <strong>Diagram:</strong>
            <img src="${data.image}" alt="Diagram for Q${qNum}">
          </div>`;
      }
      if (data.audio) {
        contentHTML += `
          <div class="hint-section">
            <strong>Audio Explanation:</strong>
            <audio controls src="${data.audio}"></audio>
          </div>`;
      }

      hintBox.innerHTML = contentHTML;

      // Re-trigger KaTeX formula parsing
      if (window.renderMathInElement) {
        renderMathInElement(hintBox, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    }

    function resetHintBox() {
      hintBox.innerHTML = `<div class="empty-state">Select a question number from ${currentExercise}.</div>`;
    }

    // Initialize UI
    renderTabs();
    renderQuestionGrid();
  </script>

  <footer>
    <a href="https://sites.google.com/view/prism-dashboard/home" target="_blank" class="prism-link">
      <span>← Back to PRISM Dashboard</span>
    </a>
    <img src="https://hits.sh/pages-ankit.github.io/Hints-Physics.svg?view=today-total&label=Page+Views&color=0066cc" alt="Page Views" />
  </footer>

</body>
</html>
