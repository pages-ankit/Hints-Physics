<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Exercise Hints</title>

  <!-- KaTeX for Physics LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 16px;
      max-width: 800px;
      margin: auto;
      background: #fafafa;
      color: #1a1a1a;
    }
    h1 { font-size: 1.3rem; margin-bottom: 12px; }

    /* Exercise Selection Tabs */
    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 6px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
    }
    .tab-btn.active {
      background: #0066cc;
      color: #fff;
      border-color: #0055aa;
    }

    /* Question Number Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }
    .q-btn {
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    /* Status: Available Hint */
    .q-btn.has-hint {
      background-color: #e8f5e9;
      border: 1px solid #81c784;
      color: #2e7d32;
    }
    .q-btn.has-hint:hover {
      background-color: #c8e6c9;
    }

    /* Status: No Hint Uploaded */
    .q-btn.no-hint {
      background-color: #f5f5f5;
      border: 1px solid #e0e0e0;
      color: #9e9e9e;
      opacity: 0.7;
    }
    .q-btn.no-hint:hover {
      background-color: #eeeeee;
    }

    /* Active Selected State */
    .q-btn.active {
      background: #222 !important;
      color: #fff !important;
      border-color: #222 !important;
      opacity: 1 !important;
    }

    /* Footer & Navigation Link */
    footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .prism-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #0066cc;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid #d0e2ff;
      background: #f0f6ff;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .prism-link:hover {
      background: #0066cc;
      color: #fff;
      border-color: #0066cc;
    }
    
    /* Hint Box Area */
    #hint-box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 16px;
      background: #fff;
      min-height: 180px;
    }
    .hint-header {
      font-size: 1.05rem;
      font-weight: bold;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .hint-section { margin-bottom: 12px; }
    .hint-section img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      margin-top: 6px;
      display: block;
    }
    audio { width: 100%; margin-top: 6px; }
    .empty-state { color: #777; font-style: italic; }
  </style>
</head>
<body>

  <h1>Hints: Work, Energy and Power Module</h1>

  <!-- Dynamic Section Tabs -->
  <div class="tabs-bar" id="tabs-container"></div>

  <!-- Dynamic Question Grid -->
  <div class="grid-container" id="index-grid"></div>

  <!-- Hint Viewer -->
  <div id="hint-box">
    <div class="empty-state">Select a question number to view hints.</div>
  </div>

  <!-- 1. Load Data FIRST so it is defined -->
  <script src="data.js"></script>

  <!-- 2. Application Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof exercisesData === "undefined") {
        console.error("exercisesData is not defined. Check if data.js is located in the same folder.");
        return;
      }

      const tabsContainer = document.getElementById("tabs-container");
      const gridContainer = document.getElementById("index-grid");
      const hintBox = document.getElementById("hint-box");

      let currentExercise = Object.keys(exercisesData)[0];

      // Helper: checks if a question actually has content
      function checkHasHint(hintObj) {
        if (!hintObj) return false;
        const text = hintObj.text ? hintObj.text.trim() : "";
        const hasText = text !== "" && text.toLowerCase() !== "hint not uploaded";
        const hasImage = Boolean(hintObj.image && hintObj.image.trim() !== "");
        const hasAudio = Boolean(hintObj.audio && hintObj.audio.trim() !== "");
        return hasText || hasImage || hasAudio;
      }

      // 1. Render Tabs
      function renderTabs() {
        tabsContainer.innerHTML = "";
        Object.keys(exercisesData).forEach(exKey => {
          const btn = document.createElement("button");
          btn.className = `tab-btn ${exKey === currentExercise ? 'active' : ''}`;
          btn.textContent = exKey;
          btn.onclick = () => {
            currentExercise = exKey;
            renderTabs();
            renderQuestionGrid();
            resetHintBox();
          };
          tabsContainer.appendChild(btn);
        });
      }

      // 2. Render Questions for Selected Exercise
      function renderQuestionGrid() {
        gridContainer.innerHTML = "";
        const exConfig = exercisesData[currentExercise];
        if (!exConfig) return;

        const hints = exConfig.hints || {};

        for (let i = 1; i <= exConfig.totalQuestions; i++) {
          const isAvailable = checkHasHint(hints[i]);
          const btn = document.createElement("button");
          btn.className = `q-btn ${isAvailable ? 'has-hint' : 'no-hint'}`;
          btn.textContent = i;
          btn.title = isAvailable ? "Hint Available" : "Hint Not Uploaded";
          btn.onclick = () => loadHint(i, btn);
          gridContainer.appendChild(btn);
        }
      }

      // 3. Display Selected Hint
      function loadHint(qNum, btnElement) {
        document.querySelectorAll(".q-btn").forEach(b => b.classList.remove("active"));
        btnElement.classList.add("active");

        const hints = exercisesData[currentExercise]?.hints || {};
        const data = hints[qNum];
        const isAvailable = checkHasHint(data);

        if (!data || !isAvailable) {
          hintBox.innerHTML = `
            <div class="hint-header">${currentExercise} — Q${qNum}</div>
            <p class="empty-state">No hint uploaded for this question yet.</p>
          `;
          return;
        }

        let contentHTML = `<div class="hint-header">${currentExercise} — Question ${qNum}</div>`;

        if (data.text && data.text.trim().toLowerCase() !== "hint not uploaded") {
          contentHTML += `<div class="hint-section"><p>${data.text}</p></div>`;
        }
        if (data.image) {
          contentHTML += `
            <div class="hint-section">
              <strong>Diagram:</strong>
              <img src="${data.image}" alt="Diagram for Q${qNum}">
            </div>`;
        }
        if (data.audio) {
          contentHTML += `
            <div class="hint-section">
              <strong>Audio Explanation:</strong>
              <audio controls src="${data.audio}"></audio>
            </div>`;
        }

        hintBox.innerHTML = contentHTML;

        // Trigger KaTeX rendering on the hintBox
        if (window.renderMathInElement) {
          renderMathInElement(hintBox, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ]
          });
        }
      }

      function resetHintBox() {
        hintBox.innerHTML = `<div class="empty-state">Select a question number from ${currentExercise}.</div>`;
      }

      // Initial execution
      renderTabs();
      renderQuestionGrid();
    });
  </script>

  <footer>
    <a href="https://sites.google.com/view/prism-dashboard/home" target="_blank" class="prism-link">
      <span>← Back to PRISM Dashboard</span>
    </a>
    <img src="https://hits.sh/pages-ankit.github.io/Hints-Physics.svg?view=today-total&label=Page+Views&color=0066cc" alt="Page Views" />
  </footer>

</body>
</html>
